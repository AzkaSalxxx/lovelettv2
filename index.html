<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoveLock Letter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <section id="startScreen" class="screen active">
      <div class="glass-card hero">
        <p class="eyebrow">private letter</p>
        <h1 id="coverTitle">LoveLock</h1>
        <p id="coverSubtitle">A little letter for you</p>
        <button id="startBtn" class="primary-btn">Continue with Sound</button>
        <p class="hint">Aktifkan suara agar musik berjalan.</p>
      </div>
    </section>

    <section id="lockScreen" class="screen">
      <div class="glass-card lock-card">
        <div class="lock-icon">🔒</div>
        <h2>Enter the Heart Code</h2>
        <p>Masukkan PIN 4 digit untuk membuka surat.</p>
        <div class="pin-row" id="pinDisplay">
          <span>0</span><span>0</span><span>0</span><span>0</span>
        </div>
        <div class="keypad">
          <button>1</button><button>2</button><button>3</button>
          <button>4</button><button>5</button><button>6</button>
          <button>7</button><button>8</button><button>9</button>
          <button id="clearPin">C</button><button>0</button><button id="enterPin">✓</button>
        </div>
        <p id="pinMessage" class="pin-message"></p>
      </div>
    </section>

    <section id="letterScreen" class="screen">
      <div class="letter-wrap">
        <article class="paper">
          <p class="eyebrow">unlocked</p>
          <h2 id="letterTitle">Dear You</h2>
          <div id="letterText" class="letter-text"></div>
          <p id="letterSign" class="sign">With love</p>
          <button id="nextBtn" class="primary-btn">Next Memories</button>
        </article>
      </div>
    </section>

    <section id="galleryScreen" class="screen">
      <div class="gallery-head">
        <p class="eyebrow">memories</p>
        <h2>Photo Collage</h2>
        <p>Tap foto untuk memperbesar.</p>
      </div>
      <div id="gallery" class="gallery"></div>
      <button id="backLetter" class="secondary-btn">Back to Letter</button>
    </section>
  </main>

  <div id="photoModal" class="modal">
    <button id="closeModal">×</button>
    <img id="modalImg" src="" alt="preview" />
  </div>

  <audio id="bgMusic" loop></audio>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
