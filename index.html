<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Lock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <audio id="bgMusic" loop>
    <source src="assets/music/music.mp3" type="audio/mpeg" />
  </audio>

  <section class="lock-screen" id="lockScreen">
    <div class="lock">
      <div class="lock-shackle"></div>

      <div class="lock-body">
        <h2>LOVE LOCK</h2>
        <p>Putar PIN untuk membuka</p>

        <div class="pin-scroll">
          <select id="pin1"></select>
          <select id="pin2"></select>
          <select id="pin3"></select>
          <select id="pin4"></select>
        </div>

        <button id="unlockBtn">Buka 🔓</button>
        <p id="wrongText"></p>
      </div>
    </div>
  </section>

  <main class="main-content" id="mainContent">
    <section class="letter-box">
      <h1 id="letterTitle"></h1>
      <p id="letterText"></p>
      <button id="skipBtn">Skip</button>
    </section>

    <section class="photo-slider">
      <button class="slide-btn" id="prevBtn">‹</button>
      <img id="slidePhoto" src="" alt="foto" />
      <button class="slide-btn" id="nextBtn">›</button>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
